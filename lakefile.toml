name = "lean2js"
version = "0.1.0"
defaultTargets = ["lean2js"]
testDriver = "testdriver"

[[lean_lib]]
name = "Lean2js"

[[lean_exe]]
name = "lean2js"
root = "Main"
supportInterpreter = true

[[lean_exe]]
name = "testdriver"
root = "TestDriver"

[[lean_exe]]
name = "lcnf-dump"
root = "LcnfDump"
supportInterpreter = true

# Kernel for the JS port of the Lean compiler (docs/tickets/self-005): vendored core of lean4lean
# (https://github.com/digama0/lean4lean, Apache-2.0, see vendor/lean4lean/); it needs Batteries.
[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.35.0"

[[lean_lib]]
name = "Lean4Lean"
srcDir = "vendor/lean4lean"
globs = ["Lean4Lean.+"]
